server:
  port: 9194

spring:
  mvc:
    throw-exception-if-no-handler-found: true
  resources:
    add-mappings: false
  web:
    resources:
      add-mappings: false

bridge:
  # mappings are generated from WSDL at startup
  auto:
    # optional CXF services page; leave empty to skip bulk discovery
    services-url: http://127.0.0.1:8080/services/
    # optional individual WSDL URLs (any suffix: wsdl-url, wsdl-1-url, wsdl-auth-url, ...)
    # wsdl-url: http://127.0.0.1:8080/services/Auth?wsdl
    # wsdl-1-url: http://127.0.0.1:8080/services/ResultList?wsdl
    # true: do not start if services-url or any wsdl-*-url is unavailable; false: log a warning and skip it
    fail-on-unavailable: true
    path-prefix: /api
    http-method: POST
    connect-timeout: 30s
    receive-timeout: 60s
  validation:
    enabled: true
  client-pool:
    maximum-size: 100
    expire-after-access: 1h
    # refresh-after-write: 6h
  backend:
    # basic-auth:
    #   username: bridge
    #   password: secret
    # ws-security:
    #   username: soap-user
    #   password: secret
    #   password-type: digest
    # credentials for services page / WSDL / XSD downloads (default: basic-auth)
    # wsdl-basic-auth:
    #   username: wsdl-reader
    #   password: secret
    # replace scheme://host:port of the WSDL soap:address, or set the address per service
    # endpoint-base-url: http://soap-backend:8080
    # endpoint-addresses:
    #   Auth: http://auth-backend:9000/services/Auth
    forward-headers: []
  # per-operation path / method / enabled
  # operations:
  #   Documents:
  #     getDocument:
  #       path: /documents/{uuid}
  #       method: GET
  soap-headers:
    json-field: soapHeaders
  errors:
    # HTTP status per SOAP fault name; unlisted faults -> 502
    fault-status:
      AccessDeniedException: 401
  correlation:
    header-name: X-Correlation-Id
    forward-to-backend: true
    soap-header:
      enabled: false

springdoc:
  show-actuator: false
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-operation-id: true
  api-docs:
    path: /v3/api-docs
    enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    io.github.connellite: DEBUG
